service: cs2032-usuarios

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    USUARIOS_TABLE: t_usuarios-${sls:stage}
    TOKENS_TABLE: t_tokens_acceso-${sls:stage}
  # AWS Academy Learner Lab no permite crear roles IAM nuevos (iam:CreateRole),
  # así que usamos el rol LabRole que ya viene creado en la cuenta en vez de
  # dejar que Serverless cree uno propio con iamRoleStatements.
  iam:
    role: arn:aws:iam::816193343783:role/LabRole

functions:
  crearUsuario:
    handler: handler.crear_usuario
    events:
      - http:
          path: usuarios
          method: post
          cors: true
  loginUsuario:
    handler: handler.login_usuario
    events:
      - http:
          path: usuarios/login
          method: post
          cors: true
  validarTokenAcceso:
    handler: handler.validar_token_endpoint
    events:
      - http:
          path: usuarios/validar
          method: get
          cors: true

resources:
  Resources:
    TablaUsuarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_usuarios-${sls:stage}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: usuario_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: usuario_id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    TablaTokens:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_tokens_acceso-${sls:stage}
        AttributeDefinitions:
          - AttributeName: token
            AttributeType: S
        KeySchema:
          - AttributeName: token
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
